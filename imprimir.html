<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imprimir relatório - Agropecuária Paineira</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#17211a}.pagina{max-width:820px;margin:18px auto;background:#fff;padding:20px}.report-header{display:flex;align-items:center;justify-content:center;gap:14px;text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:12px}.logo{width:70px;height:70px;object-fit:contain}.bloco{margin:12px 0}.bloco h3{border-bottom:1px solid #aaa;padding-bottom:4px}.tabela{width:100%;border-collapse:collapse;font-size:13px}.tabela th,.tabela td{border:1px solid #cfd6d0;padding:7px;text-align:left}.tabela th{background:#edf2ee}.acoes{display:flex;justify-content:center;gap:12px;margin:18px 0}.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:20px;cursor:pointer}.imprimir{background:#176b3a;color:#fff}.voltar{background:#e7ece8;color:#17211a}.aviso{text-align:center;font-size:13px;color:#555;margin-top:8px}@media print{@page{size:A4 portrait;margin:12mm}body{background:#fff}.pagina{max-width:none;margin:0;padding:0}.no-print{display:none!important}.report-header,.bloco{break-inside:avoid}.tabela{font-size:11px}}
</style>
</head>
<body>
<div class="pagina" id="pagina"></div>
<div class="acoes no-print"><button class="btn voltar" onclick="window.close();history.back()">← VOLTAR</button><button class="btn imprimir" onclick="window.print()" aria-label="Imprimir">🖨️ IMPRIMIR</button></div>
<div class="aviso no-print">Se a tela de impressão não abrir automaticamente, toque no botão da impressora acima.</div>
<script>
const LOGO_URL='assets/logo-paineira.png?v=20260911-0848';
const num=v=>Number(String(v??'').replace(',','.'))||0;
const moeda=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function cpfMask(v){let d=String(v||'').replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function cnpjMask(v){let d=String(v||'').replace(/\D/g,'').slice(0,14);return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')}
const e=JSON.parse(localStorage.getItem('controlePeso')||'{}');
e.animais=Array.isArray(e.animais)?e.animais:[];e.vendedor=e.vendedor||{};e.comprador=e.comprador||{};
const peso=e.animais.reduce((s,a)=>s+num(a.peso),0),q=e.animais.length,media=q?peso/q:0,bruto=peso*num(e.valorKg),fr=bruto*num(e.fundo)/100,liquido=bruto-fr;
const v=e.vendedor,c=e.comprador,doc=c.cpf?`CPF: ${cpfMask(c.cpf)}`:(c.cnpj?`CNPJ: ${cnpjMask(c.cnpj)}`:'Documento: -');
document.querySelector('#pagina').innerHTML=`<div class="report-header"><img src="${LOGO_URL}" class="logo"><div><h2>AGROPECUÁRIA PAINEIRA</h2><b>RELATÓRIO DE PESAGEM E VENDA</b></div></div><div class="bloco"><h3>DADOS DO VENDEDOR</h3><b>${v.nome||'-'}</b> — CPF: ${v.cpf?cpfMask(v.cpf):'-'}<div>Banco: ${v.banco||'-'} &nbsp; Agência: ${v.agencia||'-'} &nbsp; Conta: ${v.conta||'-'}</div></div><div class="bloco"><h3>DADOS DO COMPRADOR</h3><b>${c.nome||'-'}</b> — ${doc}<div>${c.endereco||'-'}${c.cidade?` — ${c.cidade}`:''}${c.cep?` — CEP ${c.cep}`:''}</div></div><div class="bloco"><h3>ANIMAIS</h3><table class="tabela"><thead><tr><th>Brinco</th><th>Peso</th><th>Descrição</th><th>Valor/kg</th><th>Total</th></tr></thead><tbody>${e.animais.map(a=>`<tr><td>${a.brinco}</td><td>${num(a.peso).toFixed(1)} kg</td><td>${a.descricao||'-'}</td><td>${moeda(e.valorKg)}</td><td>${moeda(num(a.peso)*num(e.valorKg))}</td></tr>`).join('')}</tbody></table></div><div class="bloco"><h3>RESUMO</h3><table class="tabela"><tbody><tr><td>Quantidade</td><td>${q}</td></tr><tr><td>Peso total</td><td>${peso.toFixed(1)} kg</td></tr><tr><td>Peso médio</td><td>${media.toFixed(1)} kg</td></tr><tr><td>Valor bruto</td><td>${moeda(bruto)}</td></tr><tr><td>Fundo Rural (${num(e.fundo).toFixed(2)}%)</td><td>- ${moeda(fr)}</td></tr><tr><td><b>VALOR LÍQUIDO</b></td><td><b>${moeda(liquido)}</b></td></tr></tbody></table></div>`;
window.addEventListener('load',()=>{setTimeout(()=>{try{window.print()}catch(err){}},350)});
</script>
</body>
</html>
