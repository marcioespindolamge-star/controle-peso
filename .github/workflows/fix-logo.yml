name: Atualizar logo oficial

on:
  push:
    paths:
      - '.github/workflows/fix-logo.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar logo oficial e aplicar
        run: |
          set -e
          mkdir -p assets
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/marcioespindolamge-star/caderno-campo/main/assets/logo-paineira.png' -o assets/logo-paineira.png
          test -s assets/logo-paineira.png
          python - <<'PY'
          from pathlib import Path
          import re
          versao='20260909-1345'
          logo=f'assets/logo-paineira.png?v={versao}'
          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          s=re.sub(r'data-app-version="[^"]+"',f'data-app-version="{versao}"',s,count=1)
          pos=s.find('<header class="topo">')
          if pos < 0: raise SystemExit('header topo nao encontrado')
          img=s.find('<img ',pos)
          fim=s.find('>',img)
          tag=s[img:fim+1]
          nova=re.sub(r'src="[^"]*"',f'src="{logo}"',tag,count=1)
          s=s[:img]+nova+s[fim+1:]
          s=re.sub(r'auto-update\.js\?v=[^"\']+',f'auto-update.js?v={versao}',s)
          idx.write_text(s,encoding='utf-8')
          Path('version.json').write_text('{"version":"'+versao+'"}\n',encoding='utf-8')
          PY
      - name: Verificar logo
        run: |
          file assets/logo-paineira.png
          grep -q 'header class="topo"><img src="assets/logo-paineira.png?v=20260909-1345"' index.html
      - name: Salvar no sistema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-paineira.png index.html version.json
          git diff --cached --quiet || git commit -m "Adiciona nova logo oficial ao cabecalho"
          git push
