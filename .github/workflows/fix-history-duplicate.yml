name: Corrigir duplicacao do historico

on:
  push:
    paths:
      - '.github/workflows/fix-history-duplicate.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir historico e atualizar versao
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          versao='20260909-1832'

          p=Path('historico.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("function arquivarAtual(){\n if(!estado.animais||!estado.animais.length)return;", "function arquivarAtual(){\n if(etapa!==4||!estado.animais||!estado.animais.length)return;")
          s=s.replace("const anterior=renderRelatorio;renderRelatorio=function(){anterior();arquivarAtual();botao()};\narquivarAtual();botao();", "const anterior=renderRelatorio;renderRelatorio=function(){anterior();if(etapa===4)arquivarAtual();botao()};\nbotao();")
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          t=idx.read_text(encoding='utf-8')
          t=re.sub(r'data-app-version="[^"]+"',f'data-app-version="{versao}"',t,count=1)
          t=re.sub(r'historico\.js\?v=[^"\']+',f'historico.js?v={versao}',t)
          t=re.sub(r'auto-update\.js\?v=[^"\']+',f'auto-update.js?v={versao}',t)
          idx.write_text(t,encoding='utf-8')
          Path('version.json').write_text('{"version":"'+versao+'"}\n',encoding='utf-8')
          PY
      - name: Verificar correcao
        run: |
          grep -q "if(etapa!==4||!estado.animais" historico.js
          grep -q 'historico.js?v=20260909-1832' index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.js index.html version.json
          git diff --cached --quiet || git commit -m "Impede historico duplicado"
          git push