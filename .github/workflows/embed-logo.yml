name: Incorporar logo no sistema
on:
  push:
    paths:
      - '.github/workflows/embed-logo.yml'
jobs:
  embed-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Incorporar logo diretamente no HTML e JS
        shell: python
        run: |
          import base64, re, pathlib
          logo = pathlib.Path('assets/logo-paineira.jpg').read_bytes()
          data = 'data:image/jpeg;base64,' + base64.b64encode(logo).decode('ascii')

          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'data-app-version="[^"]+"', 'data-app-version="20260909-1230"', s, count=1)
          s = re.sub(r'<img src="assets/logo-paineira\.jpg\?v=[^"]+" class="logo" alt="Agropecuária Paineira">', '<img src="'+data+'" class="logo" alt="Agropecuária Paineira">', s, count=1)
          s = re.sub(r'app\.js\?v=[0-9-]+', 'app.js?v=20260909-1230', s)
          s = re.sub(r'auto-update\.js\?v=[0-9-]+', 'auto-update.js?v=20260909-1230', s)
          s = re.sub(r'imprimir\.html\?v=[0-9-]+', 'imprimir.html?v=20260909-1230', s)
          p.write_text(s, encoding='utf-8')

          p = pathlib.Path('app.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'const LOGO_URL="[^"]+";', 'const LOGO_URL="'+data+'";', s, count=1)
          p.write_text(s, encoding='utf-8')

          p = pathlib.Path('imprimir.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"const LOGO_URL='[^']+';", "const LOGO_URL='"+data+"';", s, count=1)
          p.write_text(s, encoding='utf-8')
      - name: Salvar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js imprimir.html
          git commit -m "Incorpora logo diretamente no sistema" || exit 0
          git push
