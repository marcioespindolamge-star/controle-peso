<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fichas"><link rel="apple-touch-icon" href="icone.svg?v=5"><link rel="icon" href="icone.svg?v=5"><title>Venda de Fichas</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f4;color:#18241d}.app{max-width:430px;min-height:100dvh;margin:auto;display:flex;flex-direction:column}.top{background:#173d2c;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:16px;margin:0}.count{font-size:13px}.count b{font-size:20px;color:#b9e7c8}.list{margin:8px;background:#fff;border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:1fr 36px 44px 44px;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #e7ece8}.name{font-weight:800;font-size:13px}.price{font-size:11px;color:#617067}.qty{text-align:center;font-size:20px;font-weight:900}.btn{width:44px;height:44px;border:0;border-radius:10px;font-size:24px;font-weight:900}.minus{background:#dfe9e2;color:#173d2c}.plus{background:#1f6b49;color:#fff}.bottom{margin-top:auto;background:#173d2c;padding:8px 10px max(8px,env(safe-area-inset-bottom))}.total{background:#fff;border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center}.total b{font-size:27px;color:#1f7a4d}.pay{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.label{font-size:10px;font-weight:800;color:#c7d7cf;margin-bottom:3px}.pay input,.result{width:100%;height:42px;border:0;border-radius:9px;font-size:20px;font-weight:900;text-align:right;padding:0 9px}.result{display:flex;align-items:center;justify-content:flex-end;background:#e7ece8}.result.ok{background:#bde8c9;color:#124a2e}.result.warn{background:#ffd7a8;color:#6a3900}.clear{width:100%;margin-top:7px;border:0;border-radius:9px;background:#fff;color:#173d2c;padding:10px;font-size:14px;font-weight:900}.muted{opacity:.35}</style></head><body><div class="app"><header class="top"><h1>VENDA DE FICHAS</h1><div class="count">Fichas: <b id="fichas">0</b></div></header><main class="list" id="lista"></main><footer class="bottom"><div class="total"><span>TOTAL</span><b id="total">R$ 0,00</b></div><div class="pay"><div><div class="label">VALOR RECEBIDO</div><input id="recebido" inputmode="decimal" placeholder="0,00"></div><div><div class="label" id="resultadoLabel">TROCO</div><div class="result" id="resultado">—</div></div></div><button class="clear" id="limpar">LIMPAR</button></footer></div><script>const produtos=[['ÁGUA',4],['REFRIGERANTE',6],['CERVEJA GARRAFA',12],['CERVEJA LATÃO',8],['DOSE WHISKY',5],['DOSE UNDERBERG',7]],qtd=Array(6).fill(0),brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),lista=document.getElementById('lista');produtos.forEach((p,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<div><div class="name">${p[0]}</div><div class="price">${brl(p[1])}</div></div><div class="qty" id="q${i}">0</div><button class="btn minus">−</button><button class="btn plus">+</button>`;r.querySelector('.minus').onclick=()=>{if(qtd[i]>0){qtd[i]--;render()}};r.querySelector('.plus').onclick=()=>{qtd[i]++;render()};lista.appendChild(r)});function pm(s){s=(s||'').trim().replace(/\./g,'').replace(',','.');return parseFloat(s)||0}function render(){qtd.forEach((v,i)=>{document.getElementById('q'+i).textContent=v;document.querySelectorAll('.minus')[i].classList.toggle('muted',!v)});let f=qtd.reduce((a,b)=>a+b,0),t=qtd.reduce((s,v,i)=>s+v*produtos[i][1],0),r=pm(recebido.value),b=document.getElementById('resultado'),l=document.getElementById('resultadoLabel');fichas.textContent=f;total.textContent=brl(t);b.className='result';if(!t||!r){l.textContent='TROCO';b.textContent='—'}else if(r>=t){l.textContent='TROCO';b.textContent=brl(r-t);b.classList.add('ok')}else{l.textContent='FALTA';b.textContent=brl(t-r);b.classList.add('warn')}}recebido.oninput=render;limpar.onclick=()=>{qtd.fill(0);recebido.value='';render()};render()</script></body></html>
