<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#173d2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fichas"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=11"><title>Venda de Fichas</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f6f4;color:#18241d;-webkit-text-size-adjust:100%;overflow:hidden}.app{width:100%;max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column}.top{flex:0 0 auto;background:#173d2c;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:15px;margin:0}.count{font-size:12px}.count b{font-size:18px;color:#b9e7c8}.list{flex:0 0 auto;margin:6px 8px 0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px #0001}.row{height:50px;display:grid;grid-template-columns:1fr 31px 40px 40px;gap:5px;align-items:center;padding:3px 7px;border-bottom:1px solid #e7ece8}.row:last-child{border:0}.name{font-weight:800;font-size:12px;line-height:1.05}.price{font-size:10px;color:#617067;margin-top:2px}.qty{text-align:center;font-size:18px;font-weight:900}.btn{width:40px;height:40px;border:0;border-radius:9px;font-size:23px;font-weight:900;touch-action:manipulation}.minus{background:#dfe9e2;color:#173d2c}.plus{background:#1f6b49;color:#fff}.bottom{margin-top:auto;background:#173d2c;padding:7px 8px max(8px,env(safe-area-inset-bottom))}.total{height:42px;background:#fff;border-radius:9px;padding:3px 9px;display:flex;justify-content:space-between;align-items:center}.total span{font-size:11px;font-weight:800}.total b{font-size:24px;color:#1f7a4d}.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:5px}.quick button{height:32px;border:0;border-radius:7px;background:#e7f0ea;color:#173d2c;font-size:12px;font-weight:900;padding:0;touch-action:manipulation}.digitar{width:100%;height:32px;margin-top:5px;border:0;border-radius:7px;background:#68c98b;color:#103a27;font-size:12px;font-weight:900}.pay{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.label{font-size:9px;font-weight:800;color:#c7d7cf;margin-bottom:2px}.pay input,.result{width:100%;height:37px;border:0;border-radius:8px;font-size:18px;font-weight:900;text-align:right;padding:0 7px}.pay input{outline:0}.result{display:flex;align-items:center;justify-content:flex-end;background:#e7ece8;color:#516158}.result.ok{background:#bde8c9;color:#124a2e}.result.warn{background:#ffd7a8;color:#6a3900}.clear{width:100%;height:36px;margin-top:6px;border:0;border-radius:8px;background:#fff;color:#173d2c;font-size:13px;font-weight:900;letter-spacing:.5px}.muted{opacity:.35}@media(max-height:760px){.row{height:43px}.btn{width:35px;height:35px}.quick button,.digitar{height:28px}.total{height:36px}.pay input,.result,.clear{height:32px}}</style></head><body><div class="app"><header class="top"><h1>VENDA DE FICHAS</h1><div class="count">Fichas: <b id="fichas">0</b></div></header><main class="list" id="lista"></main><footer class="bottom"><div class="total"><span>TOTAL</span><b id="total">R$ 0,00</b></div><div class="quick"><button data-v="10">10</button><button data-v="20">20</button><button data-v="30">30</button><button data-v="40">40</button><button data-v="50">50</button><button data-v="100">100</button><button data-v="25">25</button><button data-v="35">35</button><button data-v="45">45</button><button data-v="55">55</button><button data-v="65">65</button><button data-v="75">75</button></div><button class="digitar" id="digitar">DIGITAR OUTRO VALOR</button><div class="pay"><div><div class="label">VALOR RECEBIDO</div><input id="recebido" inputmode="decimal" placeholder="0,00" readonly></div><div><div class="label" id="resultadoLabel">TROCO</div><div class="result" id="resultado">—</div></div></div><button class="clear" id="limpar">LIMPAR</button></footer></div><script>const produtos=[['ÁGUA',4],['REFRIGERANTE',6],['CERVEJA GARRAFA',12],['CERVEJA LATÃO',8],['DOSE WHISKY',5],['DOSE UNDERBERG',7]];const qtd=Array(produtos.length).fill(0),brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),lista=document.getElementById('lista'),recebidoEl=document.getElementById('recebido');produtos.forEach((p,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div><div class="name">${p[0]}</div><div class="price">${brl(p[1])}</div></div><div class="qty" id="q${i}">0</div><button class="btn minus">−</button><button class="btn plus">+</button>`;r.querySelector('.minus').onclick=()=>{if(qtd[i]>0){qtd[i]--;render()}};r.querySelector('.plus').onclick=()=>{qtd[i]++;render()};lista.appendChild(r)});function parseMoney(s){s=(s||'').trim().replace(/\./g,'').replace(',','.');const n=parseFloat(s);return Number.isFinite(n)?n:0}function totalVenda(){return qtd.reduce((s,v,i)=>s+v*produtos[i][1],0)}function render(){qtd.forEach((v,i)=>{document.getElementById('q'+i).textContent=v;document.querySelectorAll('.minus')[i].classList.toggle('muted',v===0)});const fichas=qtd.reduce((a,b)=>a+b,0),total=totalVenda();document.getElementById('fichas').textContent=fichas;document.getElementById('total').textContent=brl(total);const recebido=parseMoney(recebidoEl.value),box=document.getElementById('resultado'),lab=document.getElementById('resultadoLabel');box.className='result';if(!total||!recebido){lab.textContent='TROCO';box.textContent='—';return}if(recebido>=total){lab.textContent='TROCO';box.textContent=brl(recebido-total);box.classList.add('ok')}else{lab.textContent='FALTA';box.textContent=brl(total-recebido);box.classList.add('warn')}}document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{recebidoEl.readOnly=true;recebidoEl.value=Number(b.dataset.v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});render()});document.getElementById('digitar').onclick=()=>{recebidoEl.readOnly=false;recebidoEl.value='';recebidoEl.focus();render()};recebidoEl.addEventListener('input',render);document.getElementById('limpar').onclick=()=>{qtd.fill(0);recebidoEl.value='';recebidoEl.readOnly=true;render()};render();</script></body></html>
