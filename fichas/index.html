<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fichas"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=11"><link rel="icon" type="image/png" href="./apple-touch-icon.png?v=11"><title>Venda de Fichas</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#f4f6f4;color:#18241d}.app{max-width:430px;height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden}.top{flex:0 0 auto;background:#173d2c;color:#fff;padding:5px 10px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:14px;margin:0}.count{font-size:11px}.count b{font-size:17px;color:#b9e7c8}.list{flex:0 0 auto;margin:5px 7px;background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 1px 6px #0001}.row{height:47px;display:grid;grid-template-columns:1fr 29px 38px 38px;gap:4px;align-items:center;padding:3px 6px;border-bottom:1px solid #e7ece8}.row:last-child{border:0}.name{font-weight:800;font-size:12px;line-height:1}.price{font-size:10px;color:#617067;margin-top:2px}.qty{text-align:center;font-size:18px;font-weight:900}.btn{width:38px;height:38px;border:0;border-radius:9px;font-size:22px;font-weight:900;touch-action:manipulation}.minus{background:#dfe9e2;color:#173d2c}.plus{background:#1f6b49;color:#fff}.spacer{flex:1;min-height:2px}.bottom{flex:0 0 auto;background:#173d2c;padding:6px 8px max(6px,env(safe-area-inset-bottom))}.total{height:40px;background:#fff;border-radius:9px;padding:3px 9px;display:flex;justify-content:space-between;align-items:center}.total span{font-size:11px;font-weight:800}.total b{font-size:23px;color:#1f7a4d}.pay{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}.label{font-size:9px;font-weight:800;color:#c7d7cf;margin-bottom:2px}.pay input,.result{width:100%;height:36px;border:0;border-radius:8px;font-size:18px;font-weight:900;text-align:right;padding:0 7px}.pay input{outline:0}.result{display:flex;align-items:center;justify-content:flex-end;background:#e7ece8;color:#516158}.result.ok{background:#bde8c9;color:#124a2e}.result.warn{background:#ffd7a8;color:#6a3900}.clear{width:100%;height:36px;margin-top:5px;border:0;border-radius:8px;background:#fff;color:#173d2c;font-size:13px;font-weight:900;letter-spacing:.5px}.muted{opacity:.35}@media(max-height:700px){.row{height:43px}.btn{width:35px;height:35px}.total{height:36px}.pay input,.result,.clear{height:33px}.top{padding-top:3px;padding-bottom:3px}}
</style></head><body><div class="app"><header class="top"><h1>VENDA DE FICHAS</h1><div class="count">Fichas: <b id="fichas">0</b></div></header><main class="list" id="lista"></main><div class="spacer"></div><footer class="bottom"><div class="total"><span>TOTAL</span><b id="total">R$ 0,00</b></div><div class="pay"><div><div class="label">VALOR RECEBIDO</div><input id="recebido" inputmode="decimal" placeholder="0,00"></div><div><div class="label" id="resultadoLabel">TROCO</div><div class="result" id="resultado">—</div></div></div><button class="clear" id="limpar">LIMPAR</button></footer></div><script>
const produtos=[['ÁGUA',4],['REFRIGERANTE',6],['CERVEJA GARRAFA',12],['CERVEJA LATÃO',8],['DOSE WHISKY',5],['DOSE UNDERBERG',7]];const qtd=Array(produtos.length).fill(0),brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),lista=document.getElementById('lista');produtos.forEach((p,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div><div class="name">${p[0]}</div><div class="price">${brl(p[1])}</div></div><div class="qty" id="q${i}">0</div><button class="btn minus">−</button><button class="btn plus">+</button>`;r.querySelector('.minus').onclick=()=>{if(qtd[i]>0){qtd[i]--;render()}};r.querySelector('.plus').onclick=()=>{qtd[i]++;render()};lista.appendChild(r)});function parseMoney(s){s=(s||'').trim().replace(/\./g,'').replace(',','.');const n=parseFloat(s);return Number.isFinite(n)?n:0}function render(){qtd.forEach((v,i)=>{document.getElementById('q'+i).textContent=v;document.querySelectorAll('.minus')[i].classList.toggle('muted',v===0)});const fichas=qtd.reduce((a,b)=>a+b,0),total=qtd.reduce((s,v,i)=>s+v*produtos[i][1],0);document.getElementById('fichas').textContent=fichas;document.getElementById('total').textContent=brl(total);const recebido=parseMoney(document.getElementById('recebido').value),box=document.getElementById('resultado'),lab=document.getElementById('resultadoLabel');box.className='result';if(!total||!recebido){lab.textContent='TROCO';box.textContent='—';return}if(recebido>=total){lab.textContent='TROCO';box.textContent=brl(recebido-total);box.classList.add('ok')}else{lab.textContent='FALTA';box.textContent=brl(total-recebido);box.classList.add('warn')}}document.getElementById('recebido').addEventListener('input',render);document.getElementById('limpar').onclick=()=>{qtd.fill(0);document.getElementById('recebido').value='';render()};render();</script></body></html>
