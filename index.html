r">','<span class="menu-emoji">📄</span>'];document.querySelector('#passos').innerHTML=etapas.map((e,i)=>`<button class="${i===etapa?'ativo':''}" onclick="ir(${i})" aria-label="${e}">${icones[i]}<span class="menu-label">${nomes[e]}</span></button>`).join('');etapas.forEach((e,i)=>document.querySelector('#'+e).classList.toggle('hidden',i!==etapa));};nav();window.print=function(){const w=window.open('imprimir.html?v=20260909-1815','_blank');if(!w){location.href='imprimir.html?v=20260909-1815';}};function adicionarBotaoPdf(){const acoes=document.querySelector('#relatorio .acoes');if(!acoes)return;let b=document.getElementById('btnPdfWhatsapp')||acoes.querySelector('[aria-label="Gerar PDF"]');if(b)return;b=document.createElement('button');b.id='btnPdfWhatsapp';b.className='btn-pdf';b.type='button';b.setAttribute('aria-label','Gerar PDF');b.title='Gerar PDF';b.innerHTML='<span class="pdf-icon" aria-hidden="true"></span>';b.onclick=compartilharPDF;acoes.insertBefore(b,acoes.lastElementChild)}const renderRelatorioOriginal=renderRelatorio;renderRelatorio=function(){renderRelatorioOriginal();adicionarBotaoPdf()};adicionarBotaoPdf();async function compartilharPDF(){try{if(!window.jspdf||!window.jspdf.jsPDF){alert('Não foi possível carregar o gerador de PDF. Verifique a internet e tente novamente.');return}const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const t=totais(),v=estado.vendedor,c=estado.comprador;let y=16;const margem=14,larg=182;const linha=(txt,negrito=false,tam=10)=>{doc.setFont('helvetica',negrito?'bold':'normal');doc.setFontSize(tam);const partes=doc.splitTextToSize(String(txt),larg);doc.text(partes,margem,y);y+=partes.length*(tam*0.42)+2};const novaPagina=()=>{doc.addPage();y=16};doc.setFillColor(0,107,120);doc.rect(0,0,210,27,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('AGROPECUARIA PAINEIRA',105,11,{align:'center'});doc.setFontSize(11);doc.text('RELATORIO DE PESA
