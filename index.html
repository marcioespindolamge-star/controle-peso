<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Peso - Agropecuária Paineira</title>
<link rel="stylesheet" href="styles.css?v=20260908-1640">
</head>
<body>
<header class="topo">
  <img src="https://raw.githubusercontent.com/marcioespindolamge-star/caderno-campo/main/assets/logo-paineira.png" class="logo" alt="Agropecuária Paineira">
  <div><h1>CONTROLE DE PESO</h1><p>AGROPECUÁRIA PAINEIRA</p></div>
</header>
<nav id="passos" class="passos"></nav>
<main class="wrap">
<section id="pesagem" class="tela"></section>
<section id="valores" class="tela hidden"></section>
<section id="vendedor" class="tela hidden"></section>
<section id="comprador" class="tela hidden"></section>
<section id="relatorio" class="tela hidden"></section>
</main>
<script src="app.js?v=20260908-1630"></script>
<script>
nav=function(){
 const icones=[
  '<span class="menu-emoji">⚖️</span>',
  '<span class="menu-emoji">💰</span>',
  '<img class="menu-img" src="assets/vendedor.svg" alt="Vendedor">',
  '<img class="menu-img" src="assets/comprador.svg" alt="Comprador">',
  '<span class="menu-emoji">📄</span>'
 ];
 document.querySelector('#passos').innerHTML=etapas.map((e,i)=>`<button class="${i===etapa?'ativo':''}" onclick="ir(${i})" aria-label="${e}">${icones[i]}<span class="menu-label">${nomes[e]}</span></button>`).join('');
 etapas.forEach((e,i)=>document.querySelector('#'+e).classList.toggle('hidden',i!==etapa));
};
nav();
window.print=function(){
 const w=window.open('imprimir.html?v=20260908-1630','_blank');
 if(!w){location.href='imprimir.html?v=20260908-1630';}
};
</script>
</body></html>
