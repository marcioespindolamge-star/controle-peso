orioOriginal=renderRelatorio;renderRelatorio=function(){renderRelatorioOriginal();adicionarBotaoPdf()};adicionarBotaoPdf();async function compartilharPDF(){try{if(!window.jspdf||!window.jspdf.jsPDF){alert('Não foi possível carregar o gerador de PDF. Verifique a internet e tente novamente.');return}const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const t=totais(),v=estado.vendedor,c=estado.comprador;let y=16;const margem=14,larg=182;const linha=(txt,negrito=false,tam=10)=>{doc.setFont('helvetica',negrito?'bold':'normal');doc.setFontSize(tam);const partes=doc.splitTextToSize(String(txt),larg);doc.text(partes,margem,y);y+=partes.length*(tam*0.42)+2};const novaPagina=()=>{doc.addPage();y=16};doc.setFillColor(0,107,120);doc.rect(0,0,210,27,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('AGROPECUARIA PAINEIRA',105,11,{align:'center'});doc.setFontSize(11);doc.text('RELATORIO DE PESAGEM E VENDA',105,19,{align:'center'});doc.setTextColor(20,53,58);y=36;linha('DADOS DO VENDEDOR',true,11);linha(`Nome: ${v.nome||'-'}`);linha(`CPF: ${v.cpf?cpfMask(v.cpf):'-'}`);linha(`Banco: ${v.banco||'-'}   Agencia: ${v.agencia||'-'}   C/C: ${v.conta||'-'}`);y+=3;linha('DADOS DO COMPRADOR',true,11);linha(`Nome: ${c.nome||'-'}`);linha(`CPF: ${c.cpf?cpfMask(c.cpf):'-'}   CNPJ: ${c.cnpj?cnpjMask(c.cnpj):'-'}`);linha(`Endereco: ${c.endereco||'-'}${c.cidade?' - '+c.cidade:''}${c.estado?'/'+c.estado:''}${c.cep?' - CEP '+cepMask(c.cep):''}`);y+=3;linha('ANIMAIS',true,11);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setFillColor(232,242,243);doc.rect(margem,y-4,larg,8,'F');doc.text('Brinco',margem+2,y);doc.text('Peso',margem+35,y);doc.text('Descricao',margem+62,y);doc.text('Valor/kg',margem+125,y);doc.text('Total',margem+158,y);y+=7;doc.setFont('helvetica','normal');estado.animais.forEach(a=>{if(y>270){novaPagina();linha('ANIMAIS - CONTINUACAO',true,11)}doc.setFontSize(8.5);const desc=String(a.descricao||'-').slice(0,31);doc.text(String(a.brinco),margem+2,y);doc.text(`${num(a.peso).toFixed(1)} kg`,margem+35,y);doc.text(desc,margem+62,y);doc.text(moeda(estado.valorKg),margem+125,y);doc.text(moeda(num(a.peso)*num(estado.valorKg)),margem+158,y);doc.setDrawColor(220,228,230);doc.line(margem,y+2,196,y+2);y+=7});if(y>235)novaPagina();y+=4;linha('RESUMO',true,11);linha(`Quantidade: ${t.q}`);linha(`Peso total: ${t.peso.toFixed(1)} kg`);linha(`Peso medio: ${t.media.toFixed(1)} kg`);linha(`Valor bruto: ${moeda(t.bruto)}`);linha(`Fundo Rural (${num(estado.fundo).toFixed(2)}%): - ${moeda(t.fr)}`);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(0,91,71);doc.text(`VALOR LIQUIDO: ${moeda(t.liquido)}`,margem,y+3);doc.setTextColor(20,53,58);const agora=new Date();const nome=`Relatorio_Pesagem_${String(agora.getDate()).padStart(2,'0')}-${String(agora.getMonth()+1).padStart(2,'0')}-${agora.getFullYear()}.pdf`;const blob=doc.output('blob');const arquivo=new File([blob],nome,{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[arquivo]})){await navigator.share({files:[arquivo],title:'Relatorio de Pesagem',text:'Agropecuaria Paineira - Relatorio de pesagem e venda'});}else{doc.save(nome)}}catch(e){if(e&&e.name==='AbortError')return;alert('Não foi possível gerar ou compartilhar o PDF. Tente novamente.')}};</script><script src="auto-update.js?v=20260909-1230"></script></body></html>
