ction><section id="relatorio" class="tela hidden"></section></main><footer class="rodape-paisagem"><div>📍 Restinga Sêca - RS</div><div>AGROPECUÁRIA PAINEIRA</div></footer><script src="app.js?v=20260908-1630"></script><script>nav=function(){const icones=['<span class="menu-emoji">⚖️</span>','<span class="menu-emoji">💰</span>','<img class="menu-img" src="assets/vendedor.svg" alt="Vendedor">','<img class="menu-img" src="assets/comprador.svg" alt="Comprador">','<span class="menu-emoji">📄</span>'];document.querySelector('#passos').innerHTML=etapas.map((e,i)=>`<button class="${i===etapa?'ativo':''}" onclick="ir(${i})" aria-label="${e}">${icones[i]}<span class="menu-label">${nomes[e]}</span></button>`).join('');etapas.forEach((e,i)=>document.querySelector('#'+e).classList.toggle('hidden',i!==etapa));};nav();window.print=function(){const w=window.open('imprimir.html?v=20260908-1630','_blank');if(!w){location.href='imprimir.html?v=20260908-1630';}};</script></body></html>
